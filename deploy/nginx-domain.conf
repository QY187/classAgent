# njust.shop: enable only after DNS, ICP filing and certificate validation.
# Keep the existing IP virtual host in its own configuration for rollback.
server {
    listen 80;
    server_name njust.shop www.njust.shop;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 308 https://njust.shop$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.njust.shop;
    ssl_certificate /etc/letsencrypt/live/njust.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/njust.shop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://njust.shop$request_uri;
}

server {
    listen 443 ssl;
    server_name njust.shop;
    ssl_certificate /etc/letsencrypt/live/njust.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/njust.shop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
