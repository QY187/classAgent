services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: classagent
      POSTGRES_PASSWORD: classagent
      POSTGRES_DB: classagent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classagent -d classagent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    working_dir: /app
    environment:
      DATABASE_URL: postgresql+psycopg://classagent:classagent@postgres:5432/classagent
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /data/uploads
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      ASR_MODEL: ${ASR_MODEL:-paraformer-v2}
      ASR_POLL_INTERVAL_SECONDS: ${ASR_POLL_INTERVAL_SECONDS:-3}
      ASR_MAX_WAIT_SECONDS: ${ASR_MAX_WAIT_SECONDS:-1800}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/api/v1}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v2}
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: classagent-audio
      S3_SECURE: "false"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      SUMMARY_MODEL: ${SUMMARY_MODEL:-deepseek-chat}
      SUMMARY_PROVIDER: ${SUMMARY_PROVIDER:-deepseek}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-root}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-123456}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
    volumes:
      - ./apps/api/app:/app/app
      - audio_data:/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./apps/api
    command: celery -A app.infrastructure.tasks.celery_app worker --loglevel=INFO
    working_dir: /app
    environment:
      DATABASE_URL: postgresql+psycopg://classagent:classagent@postgres:5432/classagent
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /data/uploads
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      ASR_MODEL: ${ASR_MODEL:-paraformer-v2}
      ASR_POLL_INTERVAL_SECONDS: ${ASR_POLL_INTERVAL_SECONDS:-3}
      ASR_MAX_WAIT_SECONDS: ${ASR_MAX_WAIT_SECONDS:-1800}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/api/v1}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v2}
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: classagent-audio
      S3_SECURE: "false"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      SUMMARY_MODEL: ${SUMMARY_MODEL:-deepseek-chat}
      SUMMARY_PROVIDER: ${SUMMARY_PROVIDER:-deepseek}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-root}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-123456}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
    volumes:
      - ./apps/api/app:/app/app
      - audio_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  audio_data:
