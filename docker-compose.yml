services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: classagent
      POSTGRES_PASSWORD: classagent
      POSTGRES_DB: classagent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classagent -d classagent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    working_dir: /app
    environment:
      DATABASE_URL: postgresql+psycopg://classagent:classagent@postgres:5432/classagent
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /data/uploads
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: classagent-audio
      S3_SECURE: "false"
      TRANSCRIPTION_PROVIDER: mock
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      SUMMARY_MODEL: ${SUMMARY_MODEL:-deepseek-chat}
      SUMMARY_PROVIDER: ${SUMMARY_PROVIDER:-deepseek}
    volumes:
      - ./apps/api/app:/app/app
      - audio_data:/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./apps/api
    command: celery -A app.tasks.celery_app worker --loglevel=INFO
    working_dir: /app
    environment:
      DATABASE_URL: postgresql+psycopg://classagent:classagent@postgres:5432/classagent
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /data/uploads
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: classagent-audio
      S3_SECURE: "false"
      TRANSCRIPTION_PROVIDER: mock
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      SUMMARY_MODEL: ${SUMMARY_MODEL:-deepseek-chat}
      SUMMARY_PROVIDER: ${SUMMARY_PROVIDER:-deepseek}
    volumes:
      - ./apps/api/app:/app/app
      - audio_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  audio_data:
